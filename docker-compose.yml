name: nexora

x-node-service: &node-service
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.dev
  working_dir: /workspace
  user: node
  init: true
  restart: unless-stopped
  volumes:
    - ./package.json:/workspace/package.json:ro
    - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
    - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
    - ./turbo.json:/workspace/turbo.json:ro
    - ./node_modules:/workspace/node_modules
    - ./apps:/workspace/apps
    - ./packages:/workspace/packages
  networks:
    - nexora

services:
  mongodb:
    image: mongo:7.0.48
    command:
      - bash
      - -c
      - >-
        printf '%s' "$$MONGO_REPLICA_SET_KEY" > /data/configdb/keyfile &&
        chmod 400 /data/configdb/keyfile &&
        chown mongodb:mongodb /data/configdb/keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile /data/configdb/keyfile
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:?Set MONGO_REPLICA_SET_KEY in .env}
    volumes:
      - mongodb_data:/data/db
    networks:
      nexora:
        aliases: [mongodb]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}).ok }'
          | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:8.0-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks: [nexora]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 4s
      retries: 10

  api:
    <<: *node-service
    working_dir: /workspace/apps/api
    command: ["node", "node_modules/tsx/dist/cli.mjs", "watch", "src/server.ts"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Nexora}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *node-service
    working_dir: /workspace/apps/worker
    command: ["node", "node_modules/tsx/dist/cli.mjs", "watch", "src/index.ts"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      WORKER_HEALTH_PORT: 4010
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bootstrap:
    <<: *node-service
    working_dir: /workspace/apps/api
    command: ["node", "--import", "tsx", "src/scripts/bootstrap-admin.ts"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Nexora}
    depends_on:
      mongodb: { condition: service_healthy }
    profiles: [bootstrap]

  web:
    <<: *node-service
    working_dir: /workspace/apps/web
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: /api/v1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  landings:
    <<: *node-service
    working_dir: /workspace/apps/landings
    command: ["node", "node_modules/next/dist/bin/next", "dev", "--hostname", "0.0.0.0", "--port", "3002"]
    environment:
      NODE_ENV: development
      PORT: 3002

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [nexora]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  nexora:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
